[project]
name = "spinning-up-alf"
version = "0.1.0"
description = "A hands-on curriculum bridging reinforcement learning and active inference"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alf-aif[learning]",
    "numpy>=2.2",
    "matplotlib>=3.10",
    "seaborn>=0.13.2",
    "jax>=0.5.3",
    "scipy>=1.15",
    "scikit-learn>=1.6",
    "jupyterlab>=4.4",
    "ipywidgets>=8.1",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "neuronav",
]

[project.optional-dependencies]
cognitive = ["neurogym>=2.3.1"]
robotics = ["pybullet>=3.2.7"]

[tool.uv]
package = false

[tool.uv.sources]
alf-aif = { git = "https://github.com/m9h/alf", rev = "c1c886b870acc2300aa22760aabaf2f8505d2d99" }
neuronav = { git = "https://github.com/awjuliani/neuro-nav", rev = "10662803e6b37a7c295b29012e36416eb70f8866" }
